<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeNetTeen: Stellar Shield</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        
        body {
            margin: 0;
            background: #050510;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            text-align: center;
        }
        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }
        #ui-top {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 10px #0ff;
        }
        
        /* Панель с кнопками сверху справа */
        #btn-panel {
            position: absolute;
            top: 10px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .game-btn {
            background: #0f172a;
            border: 2px solid #0ea5e9;
            color: #0ea5e9;
            padding: 8px 15px;
            font-family: 'Orbitron', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .game-btn:hover { background: #0ea5e9; color: #fff; }
        
        /* Модальные окна */
        .modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 15, 30, 0.95);
            border: 2px solid #0ea5e9;
            padding: 25px;
            border-radius: 15px;
            width: 85%;
            max-width: 450px;
            box-shadow: 0 0 30px #0ea5e9;
            z-index: 20;
        }
        .modal h2 { color: #38bdf8; margin-top: 0; font-size: 22px; }
        .modal p { font-family: Arial, sans-serif; font-size: 15px; line-height: 1.5; text-align: left;}
        .modal button {
            background: #0ea5e9;
            border: none;
            color: #fff;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Orbitron', sans-serif;
            width: 100%;
        }
        #encyclopedia {
            max-height: 350px;
            overflow-y: auto;
            text-align: left;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        .encyclopedia-item { border-bottom: 1px solid #333; padding: 12px 0; display: flex; align-items: center;}
        .encyclopedia-item span { font-size: 24px; margin-right: 15px; min-width: 30px; text-align: center;}
        .locked-item { color: #64748b; }
        .unlocked-item { color: #4ade80; }
        .progress-text { color: #facc15; font-size: 16px; margin-bottom: 15px; font-family: 'Orbitron', sans-serif;}
    </style>
</head>
<body>

    <!-- Кнопки управления -->
    <div id="btn-panel">
        <button class="game-btn" id="pause-btn" onclick="togglePause()">Үзіліс ⏸️</button>
        <button class="game-btn" onclick="openEncyclopedia()">Журнал 📖</button>
    </div>

    <!-- UI игры -->
    <div id="ui-top">
        <div>ҰПАЙ: <span id="score">0</span></div>
        <div>ҚАЛҚАН: <span id="lives">3</span> 💖</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Окно паузы -->
    <div id="pauseModal" class="modal">
        <h2>⏸️ ОЙЫН ТОҚТАТЫЛДЫ</h2>
        <p style="text-align: center; color: #94a3b8;">Демалып ал, капитан! Кибер-кеңістік күте тұрады.</p>
        <button onclick="togglePause()">Жалғастыру ▶️</button>
    </div>

    <!-- Окно нового термина -->
    <div id="learningModal" class="modal">
        <h2>⚠️ ЖАҢА ҚАУІП АНЫҚТАЛДЫ!</h2>
        <h3 id="termTitle" style="color: #facc15; text-align: center;"></h3>
        <p id="termDesc"></p>
        <button onclick="resumeFromLearning()">Түсіндім! Жоюды жалғастыру 🚀</button>
    </div>

    <!-- Окно Журнала -->
    <div id="encyclopediaModal" class="modal">
        <h2>Борт журналы</h2>
        <div id="progressText" class="progress-text">Ашылған вирустар: 0 / 10</div>
        <div id="encyclopedia"></div>
        <button onclick="closeEncyclopedia()">Ойынға оралу</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth > 600 ? 600 : window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let lives = 3;
        let gamePaused = false;
        let frameCount = 0;
        
        let bullets = [];
        let enemies = [];
        let stars = [];
        let unlockedTerms = new Set();

        let ship = { x: canvas.width / 2, y: canvas.height - 80, size: 40 };

        const threatTypes = [
            { id: 1, name: "Фишинг (Phishing)", emoji: "🎣", desc: "Ресми сайттар, банктер немесе сервистер ретінде жамылып, парольдерді ұрлау әдісі.", hp: 1, behavior: "phisher" },
            { id: 2, name: "Скам (Scam)", emoji: "💸", desc: "Интернеттегі алаяқтық: пайдаланушыны алдап, оңай ақшаға қызықтырып, қаржысын ұрлау.", hp: 1, behavior: "zigzag" },
            { id: 3, name: "Троян (Trojan)", emoji: "🎁", desc: "Пайдалы бағдарлама болып көрініп, ішіне жасырынған вирус. Қорғанысты бұзады.", hp: 1, behavior: "spawner" },
            { id: 4, name: "Төлем бопсалаушы (Ransomware)", emoji: "🔒", desc: "Компьютердегі файлдарды шифрлап, оларды ашу үшін төлем талап ететін вирус.", hp: 3, behavior: "tank" },
            { id: 5, name: "DDoS-шабуыл", emoji: "🌩️", desc: "Серверді миллиондаған жасанды сұраныстармен жүктеп, сайттың жұмысын тоқтату.", hp: 1, behavior: "swarm" },
            { id: 6, name: "Шпиондық бағдарлама", emoji: "👁️‍🗨️", desc: "Пайдаланушының әрекеттерін, құпиясөздерін жасырын бақылайтын бағдарлама.", hp: 1, behavior: "stealth" },
            { id: 7, name: "Деректердің ағып кетуі", emoji: "🕳️", desc: "Компаниялардың логин, пароль және құпия ақпараттарын ұрлау.", hp: 1, behavior: "bouncer" },
            { id: 8, name: "Дипфейк (Deepfake)", emoji: "🎭", desc: "Жасанды интеллект арқылы жасалған жалған аудио/видео. Таныс адамды айнытпай салады.", hp: 1, behavior: "glitch" },
            { id: 9, name: "Әлеуметтік инженерия", emoji: "🧠", desc: "Техниканы емес, адамның психологиясын (қорқыныш, аяушылық) пайдаланып алдау.", hp: 1, behavior: "homing" },
            { id: 10, name: "SIM-свопинг", emoji: "📱", desc: "Алаяқтың сенің телефон нөміріңді өз SIM-картасына көшіріп, банк кодтарын ұрлауы.", hp: 1, behavior: "fast" }
        ];

        // Первоначальное заполнение журнала "закрытыми" вирусами
        updateEncyclopediaUI();

        for(let i = 0; i < 50; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 2 + 1 });
        }

        window.addEventListener("mousemove", (e) => {
            if(gamePaused) return;
            let rect = canvas.getBoundingClientRect();
            ship.x = e.clientX - rect.left;
        });
        window.addEventListener("touchmove", (e) => {
            if(gamePaused) return;
            let rect = canvas.getBoundingClientRect();
            ship.x = e.touches[0].clientX - rect.left;
        });
        window.addEventListener("mousedown", shoot);
        window.addEventListener("touchstart", shoot);

        function shoot(e) {
            // Чтобы не стрелять при нажатии на кнопки
            if (e.target.tagName === 'BUTTON' || gamePaused) return;
            bullets.push({ x: ship.x, y: ship.y - 20, speed: 10 });
        }

        function spawnEnemy(specificType = null, xPos = null, yPos = null) {
            if (gamePaused) return;
            let type = specificType || threatTypes[Math.floor(Math.random() * threatTypes.length)];
            
            let enemy = {
                x: xPos !== null ? xPos : Math.random() * (canvas.width - 60) + 30,
                y: yPos !== null ? yPos : -40,
                size: type.behavior === 'tank' ? 50 : 35,
                speed: 1.5 + Math.random() * 1.5,
                hp: type.hp,
                data: type,
                vx: (Math.random() > 0.5 ? 1 : -1) * 2,
                opacity: 1,
                displayEmoji: type.emoji
            };

            if(type.behavior === 'swarm' && specificType === null) {
                for(let i=0; i<3; i++) spawnEnemy(type, enemy.x + (i*40) - 40, -40);
                return;
            }
            enemies.push(enemy);
        }

        setInterval(spawnEnemy, 1500);

        function update() {
            if (gamePaused) return;
            frameCount++;

            stars.forEach(s => {
                s.y += s.speed;
                if(s.y > canvas.height) s.y = 0;
            });

            bullets.forEach((b, i) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(i, 1);
            });

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;

                if(e.data.behavior === 'zigzag') {
                    e.x += Math.sin(frameCount / 10) * 3;
                } else if(e.data.behavior === 'bouncer') {
                    e.x += e.vx;
                    if(e.x < 20 || e.x > canvas.width - 20) e.vx *= -1;
                } else if(e.data.behavior === 'fast') {
                    e.y += e.speed * 1.5;
                } else if(e.data.behavior === 'homing') {
                    if(e.x < ship.x) e.x += 1;
                    if(e.x > ship.x) e.x -= 1;
                } else if(e.data.behavior === 'phisher') {
                    if(e.y < canvas.height / 2) e.displayEmoji = "🛡️";
                    else { e.displayEmoji = "🎣"; e.y += 2; }
                } else if(e.data.behavior === 'glitch') {
                    if(frameCount % 20 === 0) {
                        const randomEmojis = ["🛸", "🛰️", "🚀", "🎭"];
                        e.displayEmoji = randomEmojis[Math.floor(Math.random() * randomEmojis.length)];
                    }
                } else if(e.data.behavior === 'stealth') {
                    e.opacity = Math.abs(Math.sin(frameCount / 20)) + 0.1;
                }

                let dist = Math.hypot(e.x - ship.x, e.y - ship.y);
                if (dist < (e.size + ship.size) / 2) {
                    enemies.splice(i, 1);
                    lives--;
                    document.getElementById("lives").innerText = lives;
                    if (lives <= 0) {
                        alert("КЕМЕ ҚИРАДЫ! Секторды вирустар басып алды ❌");
                        document.location.reload();
                    }
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.hypot(e.x - b.x, e.y - b.y) < e.size/2 + 10) {
                        bullets.splice(j, 1);
                        e.hp--;
                        
                        if(e.hp <= 0) {
                            if(e.data.behavior === 'spawner') {
                                spawnEnemy(threatTypes.find(t=>t.behavior==='swarm'), e.x-20, e.y);
                                spawnEnemy(threatTypes.find(t=>t.behavior==='swarm'), e.x+20, e.y);
                            }
                            
                            score += (e.data.behavior === 'tank' ? 50 : 10);
                            document.getElementById("score").innerText = score;
                            
                            if(!unlockedTerms.has(e.data.id)) {
                                unlockedTerms.add(e.data.id);
                                showTermModal(e.data);
                            }
                            enemies.splice(i, 1);
                        }
                        break;
                    }
                }
                
                if (e && e.y > canvas.height + 50) enemies.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#fff";
            stars.forEach(s => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.beginPath(); ctx.arc(s.x, s.y, 1.5, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.fillStyle = "#0ff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#0ff";
            bullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
            });
            ctx.shadowBlur = 0;

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            enemies.forEach(e => {
                ctx.globalAlpha = e.opacity;
                ctx.font = e.size + "px Arial";
                if(e.data.behavior === 'tank') {
                    ctx.fillStyle = "red";
                    ctx.fillRect(e.x - 20, e.y - 30, 40 * (e.hp/3), 5);
                }
                ctx.fillText(e.displayEmoji, e.x, e.y);
            });
            ctx.globalAlpha = 1;

            ctx.font = "40px Arial";
            ctx.fillText("🚀", ship.x, ship.y);
        }

        // Логика Паузы
        function togglePause() {
            // Если открыты другие окна - кнопку паузы блокируем
            if(document.getElementById("learningModal").style.display === "block" || 
               document.getElementById("encyclopediaModal").style.display === "block") return;

            gamePaused = !gamePaused;
            if(gamePaused) {
                document.getElementById("pauseModal").style.display = "block";
                document.getElementById("pause-btn").innerText = "Ойнау ▶️";
            } else {
                document.getElementById("pauseModal").style.display = "none";
                document.getElementById("pause-btn").innerText = "Үзіліс ⏸️";
            }
        }

        function showTermModal(data) {
            gamePaused = true;
            document.getElementById("termTitle").innerText = data.emoji + " " + data.name;
            document.getElementById("termDesc").innerText = data.desc;
            document.getElementById("learningModal").style.display = "block";
            updateEncyclopediaUI();
        }

        function resumeFromLearning() {
            document.getElementById("learningModal").style.display = "none";
            gamePaused = false;
        }

        // Обновление Журнала с Покедекс-эффектом
        function updateEncyclopediaUI() {
            let html = "";
            document.getElementById("progressText").innerText = `Ашылған вирустар: ${unlockedTerms.size} / 10`;

            threatTypes.forEach(t => {
                if(unlockedTerms.has(t.id)) {
                    html += `
                    <div class="encyclopedia-item unlocked-item">
                        <span>${t.emoji}</span> 
                        <div><b>${t.name}</b><br><small style="color:#cbd5e1;">${t.desc}</small></div>
                    </div>`;
                } else {
                    html += `
                    <div class="encyclopedia-item locked-item">
                        <span>🔒</span> 
                        <div><b>Белгісіз вирус</b><br><small>Бұл қауіптің құлпын ашу үшін оны ғарышта тауып, жой!</small></div>
                    </div>`;
                }
            });
            document.getElementById("encyclopedia").innerHTML = html;
        }

        function openEncyclopedia() {
            gamePaused = true;
            updateEncyclopediaUI();
            document.getElementById("encyclopediaModal").style.display = "block";
        }
        
        function closeEncyclopedia() {
            document.getElementById("encyclopediaModal").style.display = "none";
            // Возвращаем игру в обычное состояние, только если пауза не была нажата вручную
            if(document.getElementById("pauseModal").style.display !== "block") {
                gamePaused = false;
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
